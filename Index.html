<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequential Programmable Device Workflow Simulator</title>
<style>
  :root{
    --bg:#0a0e0f;
    --panel:#10171a;
    --panel2:#141d20;
    --grid:#1c2a2c;
    --line:#26383b;
    --trace:#7dffc0;
    --trace-dim:#3f7a63;
    --amber:#ffb454;
    --red:#ff6161;
    --text:#d6ece5;
    --muted:#6f8f8a;
    --mono: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--trace);color:#04120c;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(10,14,15,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1180px; margin:0 auto; padding:14px 20px 0;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  .brand .mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--trace);
    box-shadow:0 0 8px var(--trace);
    flex:none;
  }
  .brand h1{
    font-size:15px; font-weight:600; letter-spacing:.01em; margin:0;
    font-family:var(--mono);
  }
  .brand .sub{color:var(--muted); font-size:12px; font-family:var(--mono);}
  nav.tabs{
    display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent; border:none; color:var(--muted);
    font-family:var(--mono); font-size:12.5px; padding:9px 13px;
    cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--trace); border-bottom-color:var(--trace);}

  main{max-width:1180px; margin:0 auto; padding:22px 20px 60px;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}

  h2.view-title{
    font-family:var(--mono); font-size:13px; color:var(--trace);
    letter-spacing:.02em; margin:0 0 4px;
  }
  p.view-desc{color:var(--muted); font-size:13.5px; margin:0 0 20px; max-width:62ch; line-height:1.55;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:16px 18px;
  }
  .grid2{display:grid; grid-template-columns:340px 1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:860px){ .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;} }

  label.field{display:block; font-size:11.5px; color:var(--muted); font-family:var(--mono); margin:12px 0 5px;}
  label.field:first-child{margin-top:0;}
  select, input[type=number]{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:4px; padding:7px 9px; font-family:var(--mono); font-size:13px;
  }
  select:focus, input:focus{outline:2px solid var(--trace-dim); outline-offset:1px;}

  .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  button.btn{
    font-family:var(--mono); font-size:12.5px; padding:8px 14px; border-radius:4px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    cursor:pointer; transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  button.btn:hover{border-color:var(--trace-dim); color:var(--trace);}
  button.btn:focus-visible{outline:2px solid var(--trace); outline-offset:2px;}
  button.btn.primary{background:var(--trace); color:#04120c; border-color:var(--trace); font-weight:600;}
  button.btn.primary:hover{background:#95ffce;}
  button.btn.danger:hover{border-color:var(--red); color:var(--red);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  button.btn:disabled:hover{border-color:var(--line); color:var(--text);}

  .sig-list{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .sig-toggle{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel2); border:1px solid var(--line); border-radius:4px;
    padding:7px 10px; cursor:pointer; user-select:none;
  }
  .sig-toggle span.name{font-family:var(--mono); font-size:12.5px;}
  .sig-toggle .dot{
    width:9px;height:9px;border-radius:50%; background:#33403f; box-shadow:none;
    transition:all .12s ease;
  }
  .sig-toggle.on .dot{background:var(--trace); box-shadow:0 0 6px var(--trace);}
  .sig-toggle.on span.name{color:var(--trace);}

  .stat-card{
    background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:13px 14px;
  }
  .stat-card .k{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.03em;}
  .stat-card .v{font-family:var(--mono); font-size:20px; margin-top:6px; color:var(--trace);}
  .stat-card .v.err{color:var(--red);}
  .stat-card .v.small{font-size:14px; color:var(--text);}

  .badge{
    display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px;
    border-radius:20px; border:1px solid var(--line); color:var(--muted);
  }
  .badge.state-normal{border-color:var(--trace-dim); color:var(--trace);}
  .badge.state-fault{border-color:#7a3030; color:var(--red);}
  .badge.state-done{border-color:var(--amber); color:var(--amber);}

  table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px;}
  th{
    text-align:left; color:var(--muted); font-weight:500; font-size:10.5px;
    letter-spacing:.03em; padding:7px 8px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--panel);
  }
  td{padding:6px 8px; border-bottom:1px solid var(--grid); color:var(--text);}
  tr:hover td{background:rgba(125,255,192,0.03);}
  .scroll-table{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:5px;}
  .scroll-table.tall{max-height:460px;}
  .empty-row td{color:var(--muted); text-align:center; padding:22px 0;}

  .pill-out{font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:3px; background:var(--panel2); color:var(--muted);}
  .pill-out.hi{background:rgba(125,255,192,.12); color:var(--trace);}
  .pill-out.err{background:rgba(255,97,97,.12); color:var(--red);}

  .timeline{overflow-x:auto; border:1px solid var(--line); border-radius:5px; padding:10px; background:var(--panel2);}
  .timeline svg{display:block;}

  .diagram-wrap{border:1px solid var(--line); border-radius:5px; background:var(--panel2); padding:6px; overflow:auto;}

  .fault-log-item{
    display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--grid);
    font-family:var(--mono); font-size:12px;
  }
  .fault-log-item:last-child{border-bottom:none;}
  .fault-log-item .tag{color:var(--red); flex:none;}

  .tc-card{
    border:1px solid var(--line); border-radius:5px; background:var(--panel2); padding:13px 14px; margin-bottom:10px;
  }
  .tc-card h3{margin:0 0 4px; font-size:13px; font-family:var(--mono); color:var(--text);}
  .tc-card p{margin:0 0 10px; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .tc-result{font-family:var(--mono); font-size:12px; margin-top:8px;}
  .tc-result.pass{color:var(--trace);}
  .tc-result.fail{color:var(--red);}

  .about-body{font-size:14px; line-height:1.7; color:var(--text); max-width:64ch;}
  .about-body h3{font-family:var(--mono); font-size:12.5px; color:var(--trace); margin:22px 0 8px;}
  .about-body code{font-family:var(--mono); background:var(--panel2); padding:1px 5px; border-radius:3px; font-size:12.5px;}

  .wd-state{
    border:1px solid var(--line); border-radius:5px; padding:12px 14px; background:var(--panel2);
    margin-bottom:9px;
  }
  .wd-state .hd{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .wd-state .hd .dot{width:8px;height:8px;border-radius:50%;}
  .wd-state .hd b{font-family:var(--mono); font-size:13px;}
  .wd-state .rule{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding:2px 0;}
  .wd-state .rule b{color:var(--text); font-weight:500;}

  footer{max-width:1180px; margin:0 auto; padding:0 20px 40px; color:var(--muted); font-size:11.5px; font-family:var(--mono);}

  .small-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="mark"></span>
      <h1>SEQ&#8203;·&#8203;SIM // Programmable Device Workflow Simulator</h1>
      <span class="sub">clocked FSM &middot; fault injection &middot; local, no server</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main id="main"></main>

<footer>index.html &mdash; single file, no build step, no external dependencies. Safe to serve from GitHub Pages as-is.</footer>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     1. FSM DEFINITION
  --------------------------------------------------------------- */
  const STATES = ["IDLE","INPUT_CHECK","PROCESSING","VALIDATION","OUTPUT","COMPLETE",
                  "INPUT_ERROR","PROCESS_ERROR","TIMEOUT","SYSTEM_FAULT"];
  const FAULT_STATES = ["INPUT_ERROR","PROCESS_ERROR","TIMEOUT","SYSTEM_FAULT"];
  const TERMINAL_STATES = ["COMPLETE", ...FAULT_STATES];
  const INPUTS = ["START","DATA_VALID","READY","VALID","ACK","FAULT"];
  const OUTPUTS = ["PROCESS_ENABLE","SUCCESS","ERROR"];
  const WAIT_LIMIT = 5; // cycles a wait-state may idle before timing out

  function nextState(state, sig, waitCount){
    switch(state){
      case "IDLE":
        return sig.START ? "INPUT_CHECK" : "IDLE";
      case "INPUT_CHECK":
        if (sig.FAULT) return "INPUT_ERROR";
        if (sig.DATA_VALID) return "PROCESSING";
        if (waitCount >= WAIT_LIMIT) return "INPUT_ERROR";
        return "INPUT_CHECK";
      case "PROCESSING":
        if (sig.FAULT) return "PROCESS_ERROR";
        if (sig.READY) return "VALIDATION";
        if (waitCount >= WAIT_LIMIT) return "TIMEOUT";
        return "PROCESSING";
      case "VALIDATION":
        if (sig.FAULT) return "SYSTEM_FAULT";
        if (sig.VALID) return "OUTPUT";
        return "PROCESS_ERROR";
      case "OUTPUT":
        if (sig.FAULT) return "SYSTEM_FAULT";
        if (sig.ACK) return "COMPLETE";
        if (waitCount >= WAIT_LIMIT) return "TIMEOUT";
        return "OUTPUT";
      default:
        return state; // terminal states hold until reset
    }
  }

  function condLabel(state, sig){
    switch(state){
      case "IDLE": return sig.START ? "START=1" : "START=0 (hold)";
      case "INPUT_CHECK":
        if (sig.FAULT) return "FAULT=1";
        if (sig.DATA_VALID) return "DATA_VALID=1";
        return "DATA_VALID=0 (wait)";
      case "PROCESSING":
        if (sig.FAULT) return "FAULT=1";
        if (sig.READY) return "READY=1";
        return "READY=0 (wait)";
      case "VALIDATION":
        if (sig.FAULT) return "FAULT=1";
        return sig.VALID ? "VALID=1" : "VALID=0";
      case "OUTPUT":
        if (sig.FAULT) return "FAULT=1";
        if (sig.ACK) return "ACK=1";
        return "ACK=0 (wait)";
      default: return "&mdash;";
    }
  }

  function outputsFor(state){
    return {
      PROCESS_ENABLE: ["INPUT_CHECK","PROCESSING","VALIDATION","OUTPUT"].includes(state) ? 1 : 0,
      SUCCESS: state === "COMPLETE" ? 1 : 0,
      ERROR: FAULT_STATES.includes(state) ? 1 : 0
    };
  }

  /* ---------------------------------------------------------------
     2. SIMULATION STATE
  --------------------------------------------------------------- */
  const sim = {
    state: "IDLE",
    prevState: null,
    cycle: 0,
    maxCycles: 20,
    clockMs: 500,
    initialState: "IDLE",
    inputs: Object.fromEntries(INPUTS.map(k=>[k,0])),
    waitCount: 0,
    trace: [],       // execution trace rows {cycle,current,input,cond,next,out,status}
    timeline: [],     // per-cycle snapshot for waveform
    faultLog: [],     // fault events
    running: false,
    timer: null,
    demoQueue: null,  // array of input-patches, one per cycle, for demo/test modes
    demoLabel: null
  };

  function snapshotInputs(){ return INPUTS.map(k=>sim.inputs[k]).join(""); }

  function logFault(msg){
    sim.faultLog.push({cycle: sim.cycle, state: sim.state, msg});
  }

  function resetSim(keepConfig){
    stopRun();
    sim.state = sim.initialState;
    sim.prevState = null;
    sim.cycle = 0;
    sim.waitCount = 0;
    sim.trace = [];
    sim.timeline = [];
    if (!keepConfig){
      sim.faultLog = [];
      INPUTS.forEach(k=>sim.inputs[k]=0);
    }
    sim.demoQueue = null;
    sim.demoLabel = null;
    renderAll();
  }

  function stepCycle(){
    if (TERMINAL_STATES.includes(sim.state) || sim.cycle >= sim.maxCycles){
      stopRun();
      return false;
    }

    // apply queued demo inputs for this cycle, if any
    if (sim.demoQueue && sim.demoQueue.length){
      const patch = sim.demoQueue.shift();
      Object.assign(sim.inputs, patch);
    }

    const before = sim.state;
    const cond = condLabel(before, sim.inputs);
    const nxt = nextState(before, sim.inputs, sim.waitCount);
    const out = outputsFor(nxt);

    sim.waitCount = (nxt === before) ? sim.waitCount + 1 : 0;

    const wasFault = !FAULT_STATES.includes(before) && FAULT_STATES.includes(nxt);
    if (wasFault) logFault(`Transitioned into fault state ${nxt} from ${before} (${cond}).`);

    let status = "RUN";
    if (FAULT_STATES.includes(nxt)) status = "FAULT";
    else if (nxt === "COMPLETE") status = "DONE";
    else if (nxt === before) status = "WAIT";

    sim.cycle += 1;
    sim.trace.push({
      cycle: sim.cycle, current: before, input: snapshotInputs(),
      cond, next: nxt, out: {...out}, status
    });
    sim.timeline.push({cycle: sim.cycle, state: nxt, inputs: {...sim.inputs}, out});

    sim.prevState = before;
    sim.state = nxt;

    renderAll();

    if (TERMINAL_STATES.includes(sim.state) || sim.cycle >= sim.maxCycles){
      stopRun();
      return false;
    }
    return true;
  }

  function startRun(){
    if (sim.running) return;
    if (TERMINAL_STATES.includes(sim.state) || sim.cycle >= sim.maxCycles) return;
    sim.running = true;
    renderControls();
    sim.timer = setInterval(()=>{
      const cont = stepCycle();
      if (!cont) stopRun();
    }, sim.clockMs);
  }

  function stopRun(){
    sim.running = false;
    if (sim.timer){ clearInterval(sim.timer); sim.timer = null; }
    renderControls();
  }

  /* ---------------------------------------------------------------
     3. DEMO / TEST SEQUENCES
  --------------------------------------------------------------- */
  function demoNormal(){
    resetSim(true);
    sim.demoLabel = "Demo: normal workflow";
    sim.demoQueue = [
      {START:1,DATA_VALID:0,READY:0,VALID:0,ACK:0,FAULT:0},
      {START:0,DATA_VALID:1},
      {DATA_VALID:0,READY:1},
      {READY:0,VALID:1},
      {VALID:0,ACK:1},
      {ACK:0}
    ];
    Object.assign(sim.inputs,{START:0,DATA_VALID:0,READY:0,VALID:0,ACK:0,FAULT:0});
    renderAll();
  }

  function demoFault(){
    resetSim(true);
    sim.demoLabel = "Demo: fault path";
    sim.demoQueue = [
      {START:1},
      {START:0,DATA_VALID:1},
      {DATA_VALID:0,READY:1},
      {READY:0,FAULT:1}
    ];
    Object.assign(sim.inputs,{START:0,DATA_VALID:0,READY:0,VALID:0,ACK:0,FAULT:0});
    renderAll();
  }

  function demoRandom(){
    resetSim(true);
    sim.demoLabel = "Synthetic random sequence";
    const q = [];
    for (let i=0;i<sim.maxCycles;i++){
      const patch = {};
      INPUTS.forEach(k=>{ if (Math.random()<0.4) patch[k]=1; else if (Math.random()<0.3) patch[k]=0; });
      q.push(patch);
    }
    sim.demoQueue = q;
    renderAll();
  }

  function runQueueToCompletion(){
    let guard = 0;
    while (sim.demoQueue && sim.demoQueue.length && guard < 500){
      if (!stepCycle()) break;
      guard++;
    }
    // drain any remaining natural transitions until terminal or max cycles
    while (!TERMINAL_STATES.includes(sim.state) && sim.cycle < sim.maxCycles && guard < 500){
      if (!stepCycle()) break;
      guard++;
    }
  }

  /* ---------------------------------------------------------------
     4. TEST CASES
  --------------------------------------------------------------- */
  const TEST_CASES = [
    {
      id:"tc-happy",
      name:"TC-01 &middot; Happy path completion",
      desc:"Drives START, DATA_VALID, READY, VALID, ACK in sequence. Expects the device to reach COMPLETE with SUCCESS=1.",
      seq:[{START:1},{START:0,DATA_VALID:1},{DATA_VALID:0,READY:1},{READY:0,VALID:1},{VALID:0,ACK:1},{ACK:0}],
      expect:"COMPLETE"
    },
    {
      id:"tc-input-fault",
      name:"TC-02 &middot; Fault during input check",
      desc:"Raises FAULT while waiting in INPUT_CHECK. Expects a transition to INPUT_ERROR with ERROR=1.",
      seq:[{START:1},{START:0,FAULT:1}],
      expect:"INPUT_ERROR"
    },
    {
      id:"tc-validation-reject",
      name:"TC-03 &middot; Validation rejects data",
      desc:"Reaches VALIDATION but VALID never asserts. Expects a transition to PROCESS_ERROR.",
      seq:[{START:1},{START:0,DATA_VALID:1},{DATA_VALID:0,READY:1},{READY:0}],
      expect:"PROCESS_ERROR"
    },
    {
      id:"tc-timeout",
      name:"TC-04 &middot; Processing timeout",
      desc:`Enters PROCESSING and READY never asserts for ${WAIT_LIMIT} cycles. Expects a transition to TIMEOUT.`,
      seq:[{START:1},{START:0,DATA_VALID:1},{DATA_VALID:0}],
      expect:"TIMEOUT",
      padWaitCycles:true
    },
    {
      id:"tc-system-fault",
      name:"TC-05 &middot; System fault in output stage",
      desc:"Reaches OUTPUT then FAULT asserts. Expects an immediate transition to SYSTEM_FAULT.",
      seq:[{START:1},{START:0,DATA_VALID:1},{DATA_VALID:0,READY:1},{READY:0,VALID:1},{VALID:0,FAULT:1}],
      expect:"SYSTEM_FAULT"
    }
  ];
  const testResults = {};

  function runTestCase(tc){
    const saved = JSON.parse(JSON.stringify(sim.inputs));
    const savedState = sim.state, savedCycle = sim.cycle, savedTrace = sim.trace,
          savedTimeline = sim.timeline, savedWait = sim.waitCount, savedPrev = sim.prevState,
          savedFaultLog = sim.faultLog;

    sim.state = sim.initialState; sim.prevState = null; sim.cycle = 0; sim.waitCount = 0;
    sim.trace = []; sim.timeline = []; sim.faultLog = [];
    INPUTS.forEach(k=>sim.inputs[k]=0);

    let queue = tc.seq.slice();
    if (tc.padWaitCycles){
      for (let i=0;i<WAIT_LIMIT+1;i++) queue.push({});
    }
    let guard = 0;
    while (queue.length && guard < 200){
      Object.assign(sim.inputs, queue.shift());
      stepCycleSilent();
      guard++;
    }
    while (!TERMINAL_STATES.includes(sim.state) && sim.cycle < 40 && guard < 200){
      stepCycleSilent();
      guard++;
    }

    const pass = sim.state === tc.expect;
    testResults[tc.id] = {pass, finalState: sim.state, cycles: sim.cycle};

    sim.state = savedState; sim.prevState = savedPrev; sim.cycle = savedCycle;
    sim.waitCount = savedWait; sim.trace = savedTrace; sim.timeline = savedTimeline;
    sim.faultLog = savedFaultLog;
    Object.assign(sim.inputs, saved);
  }

  function stepCycleSilent(){
    const before = sim.state;
    const cond = condLabel(before, sim.inputs);
    const nxt = nextState(before, sim.inputs, sim.waitCount);
    sim.waitCount = (nxt === before) ? sim.waitCount + 1 : 0;
    sim.cycle += 1;
    sim.state = nxt;
  }

  function runAllTests(){
    TEST_CASES.forEach(runTestCase);
    renderTestCases();
  }

  /
